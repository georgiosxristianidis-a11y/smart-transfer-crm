<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#180D3D"/>
      <stop offset="100%" stop-color="#060214"/>
    </radialGradient>

    <!-- Highway Trajectory 1 Gradient -->
    <linearGradient id="stRoad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Highway Trajectory 2 Gradient -->
    <linearGradient id="stRoad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <!-- Jet Apex Glow Gradient -->
    <linearGradient id="stJet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>

    <!-- Subtle Ambient Bloom Filter -->
    <filter id="stGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Squircle Glass Base (Border & Surface) -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#stBg)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- 2. Neon Ambient Underglow -->
  <path d="M 34 94 C 36 68 52 52 82 30" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" opacity="0.3" filter="url(#stGlow)"/>
  <path d="M 50 94 C 54 74 66 60 92 40" stroke="#6366F1" stroke-width="7" stroke-linecap="round" opacity="0.25" filter="url(#stGlow)"/>

  <!-- 3. Primary Kinetic Highway Ribbons -->
  <path d="M 34 94 C 36 66 52 50 82 30" 
        stroke="url(#stRoad1)" stroke-width="5" stroke-linecap="round"/>
  <path d="M 50 94 C 54 74 66 60 92 40" 
        stroke="url(#stRoad2)" stroke-width="5" stroke-linecap="round"/>

  <!-- 4. Ascending Jet Wing Silhouette -->
  <!-- Left Wing -->
  <path d="M 48 46 L 74 34 L 68 58 Z" 
        fill="rgba(45, 212, 191, 0.2)" stroke="url(#stRoad1)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Fuselage & Right Wing -->
  <path d="M 82 30 L 98 48 L 90 52 L 80 40 L 68 58 L 84 20 Z" 
        fill="url(#stJet)" stroke="#FFFBEB" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- 5. Apex Golden Flare Dot -->
  <circle cx="84" cy="20" r="3.5" fill="#FFFBEB" filter="url(#stGlow)"/>
</svg>
