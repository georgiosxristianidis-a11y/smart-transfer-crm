<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" fill="none" role="img" aria-label="Smart Transfer">
  <!--
    Master mark, maskable-first. The plate is full bleed because a maskable icon is
    cropped to a platform shape: a squircle drawn inside the canvas would show
    transparent corners. The mark sits inside the safe circle (centre 64,64 r 51.2),
    so no launcher shape can clip the beacon.
    Light weight of the identity; the heavy weight lives in favicon.svg.
  -->
  <defs>
    <radialGradient id="stBg" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#140A34"/>
      <stop offset="100%" stop-color="#060214"/>
    </radialGradient>

    <linearGradient id="stTeal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <linearGradient id="stIndigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>

    <linearGradient id="stDelta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <filter id="stGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="128" height="128" fill="url(#stBg)"/>

  <g transform="translate(64,64) scale(0.82) translate(-64,-64)">
    <path d="M 32 94 C 36 66 52 50 84 26" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" opacity="0.25" filter="url(#stGlow)"/>
    <path d="M 48 94 C 52 72 64 58 92 34" stroke="#6366F1" stroke-width="8" stroke-linecap="round" opacity="0.22" filter="url(#stGlow)"/>

    <path d="M 32 94 C 36 66 52 50 84 26" stroke="url(#stTeal)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 48 94 C 52 72 64 58 92 34" stroke="url(#stIndigo)" stroke-width="5" stroke-linecap="round"/>

    <polygon points="92,18 98,38 88,34 76,42 92,18" fill="url(#stDelta)" stroke="#FFFBEB" stroke-width="1.5" stroke-linejoin="round"/>

    <circle cx="92" cy="18" r="3" fill="#FBBF24" filter="url(#stGlow)"/>
    <circle cx="92" cy="18" r="1.5" fill="#FFFBEB"/>
  </g>
</svg>
